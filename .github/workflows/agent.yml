name: Trading Agent

on:
  schedule:
    - cron: '*/10 * * * 1-5'
  workflow_dispatch:
    inputs:
      agent_mode:
        description: 'Tryb pracy agenta (shadow = bezpieczny test, live = produkcja)'
        required: false
        default: 'shadow'
        type: choice
        options:
          - shadow
          - live

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run agent
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        # Domyślnie 'shadow' przy uruchomieniu z harmonogramu (cron) - bezpieczny
        # tryb testowy, który wysyła powiadomienia, ale NIE zmienia wag ML/progu/
        # statystyk. Uruchomienie ręczne (workflow_dispatch) pozwala wybrać 'live'.
        AGENT_MODE: ${{ github.event.inputs.agent_mode || 'shadow' }}
        # XTB (opcjonalnie - tylko realny spread, NIE ceny/świece):
        XTB_LOGIN: ${{ secrets.XTB_LOGIN }}
        XTB_PASSWORD: ${{ secrets.XTB_PASSWORD }}
      run: python agent.py

    - name: Commit changes
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add -A
        git commit -m 'Auto-update data' || echo "No changes"
        git push || echo "Push failed"
