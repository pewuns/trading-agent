name: Trading Agent

on:
  schedule:
    # Uruchamiaj co 15 min przez całą dobę, także w weekendy, aby monitorować
    # otwarte pozycje krypto poza standardowym oknem analizy rynków.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      agent_mode:
        description: 'Tryb pracy agenta (shadow = bezpieczny test, live = produkcja)'
        required: false
        default: 'shadow'
        type: choice
        options:
          - shadow
          - live

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run agent
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
        # Twelve Data (GŁÓWNE źródło cen dla 6 par forex - patrz FOREX_SYMBOLS
        # w agent.py). Bez tego sekretu forex automatycznie spada na Yahoo.
        TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        # Domyślnie 'shadow' przy uruchomieniu z harmonogramu (cron): wysyła
        # powiadomienia i uczy osobne kopie wag/statystyk. Ręczne uruchomienie
        # (workflow_dispatch) pozwala wybrać 'live'.
        AGENT_MODE: ${{ github.event.inputs.agent_mode || 'shadow' }}
        # XTB (opcjonalnie - tylko realny spread, NIE ceny/świece):
        XTB_LOGIN: ${{ secrets.XTB_LOGIN }}
        XTB_PASSWORD: ${{ secrets.XTB_PASSWORD }}
      run: python agent.py

    - name: Archive run logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: agent-logs-${{ github.run_id }}
        path: |
          shadow_scoring_log.jsonl
          shadow_scoring_log_summary.jsonl
          near_miss_log.jsonl
          near_miss_log_summary.jsonl
          shadow_near_miss_log.jsonl
          shadow_near_miss_log_summary.jsonl
          data_fetch_errors.jsonl
          data_fetch_errors_summary.jsonl
        if-no-files-found: ignore
        retention-days: 30

    - name: Commit changes
      run: |
        git config user.name 'GitHub Actions Bot'
        git config user.email 'actions@github.com'
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to commit."
          exit 0
        fi
        git commit -m 'Auto-update data'
        git push
